# Second consumer of the shared volume: reads the log files written by every service pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-reader
  namespace: fooddelivery
  labels:
    app: log-reader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-reader
  template:
    metadata:
      labels:
        app: log-reader
    spec:
      initContainers:
        - name: open-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chmod 777 /var/log/app"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
      containers:
        - name: reader
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                echo "=== files on the shared volume ==="
                ls -l /var/log/app
                for f in /var/log/app/*.log; do
                  [ -f "$f" ] && { echo "--- $f"; tail -n 3 "$f"; }
                done
                sleep 20
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
              readOnly: true
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: app-logs
