# Fanout Ingress for the domain fooddelivery.com: one host, many URL paths.
# Every path points to the API Gateway, so no client request can reach a microservice directly.
# Any path that is not listed here gets a 404 from the Ingress controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fooddelivery-fanout
  namespace: fooddelivery
spec:
  ingressClassName: nginx
  rules:
    - host: fooddelivery.com
      http:
        paths:
          - path: /register
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /login
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /owner
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /delivery
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /customer
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
