# Non-secret settings shared by the pods. Service names are resolved by Kubernetes DNS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: fooddelivery
data:
  LOG_DIR: /var/log/app
  REGISTRATION_URL: http://registration-service:8081
  LOGIN_URL: http://login-service:8082
  ADMIN_URL: http://admin-service:8083
  OWNER_URL: http://owner-service:8084
  DELIVERY_URL: http://delivery-service:8086
  CUSTOMER_URL: http://customer-service:8085
