# API Gateway (port 8080), 2 replicas. Verifies the JWT and role, then forwards to the services.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: fooddelivery
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api-gateway
          image: nsmony/api-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: PORT
              value: "8080"
            - name: SERVICE_NAME
              value: api-gateway
            - name: JWT_SECRETE
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: JWT_SECRETE
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: app-logs
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: fooddelivery
  labels:
    app: api-gateway
spec:
  type: ClusterIP        # internal only: clients cannot reach this service directly
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
