# OPTIONAL: only enforced if the cluster has a CNI that supports NetworkPolicy, e.g.
#   minikube start --driver=docker --cni=calico
# Apply with: kubectl apply -f k8s/optional/
# Result: the microservices accept traffic only from the API Gateway pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: fooddelivery
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller-to-gateway
  namespace: fooddelivery
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-microservices
  namespace: fooddelivery
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - registration-service
          - login-service
          - admin-service
          - owner-service
          - delivery-service
          - customer-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
