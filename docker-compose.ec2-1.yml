services:
  api-service:
    build: ./api-service
    ports: ["8080:8080"]
    environment:
      JWT_SECRETE: ${JWT_SECRETE}
      REGISTRATION_URL: ${REGISTRATION_URL}
      LOGIN_URL: ${LOGIN_URL}
      ADMIN_URL: ${ADMIN_URL}
      OWNER_URL: ${OWNER_URL}
      DELIVERY_URL: ${DELIVERY_URL}
      CUSTOMER_URLS: ${CUSTOMER_URLS}
    restart: unless-stopped

  registration-service:
    build: ./registration-service
    ports: ["8081:8081"]
    environment:
      MONGO_URI: ${MONGO_URI}
    restart: unless-stopped

  login-service:
    build: ./login-service
    ports: ["8082:8082"]
    environment:
      MONGO_URI: ${MONGO_URI}
      JWT_SECRETE: ${JWT_SECRETE}
    restart: unless-stopped
