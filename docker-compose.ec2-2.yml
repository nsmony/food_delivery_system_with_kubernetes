services:
  admin-service:
    build: ./admin-service
    ports: ["8083:8083"]
    environment:
      MONGO_URI: ${MONGO_URI}
    restart: unless-stopped

  owner-service:
    build: ./owner-service
    ports: ["8084:8084"]
    environment:
      MONGO_URI: ${MONGO_URI}
    restart: unless-stopped

  delivery-service:
    build: ./delivery-service
    ports: ["8086:8086"]
    environment:
      MONGO_URI: ${MONGO_URI}
    restart: unless-stopped
